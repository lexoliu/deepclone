name: release-artifacts
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-dist@0.34.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build archives and installers
        run: |
          dist build --tag "$RELEASE_TAG" --artifacts=local --output-format=json > local-dist-manifest.json
          cp local-dist-manifest.json target/distrib/aarch64-apple-darwin-dist-manifest.json
          dist build --tag "$RELEASE_TAG" --artifacts=global --output-format=json > global-dist-manifest.json
          python3 .github/scripts/release_assets.py --output "$RUNNER_TEMP/release-assets" local-dist-manifest.json global-dist-manifest.json
          python3 .github/scripts/check_release_artifacts.py "$RUNNER_TEMP/release-assets"
      - id: name
        run: echo "artifact=release-${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: artifacts
      - name: Publish the prepared release
        run: |
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
