name: ci
on:
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "build.rs", "src/**", "tests/**", "export/**", "dist-workspace.toml", "release-plz.toml", ".github/**", "web/**"]
  merge_group:
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", "build.rs", "src/**", "tests/**", "export/**", "dist-workspace.toml", "release-plz.toml", ".github/**", "web/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dependencies: ${{ steps.detect.outputs.dependencies }}
      workflows: ${{ steps.detect.outputs.workflows }}
      rust_lint: ${{ steps.detect.outputs.rust_lint }}
      rust_macos: ${{ steps.detect.outputs.rust_macos }}
      burn_linux: ${{ steps.detect.outputs.burn_linux }}
      export: ${{ steps.detect.outputs.export }}
      release_preview: ${{ steps.detect.outputs.release_preview }}
      browser: ${{ steps.detect.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python3 .github/scripts/ci_changes.py

  dependencies:
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-audit
      - run: python3 .github/scripts/check_dependencies.py

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-dist@0.34.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: stable
          cache: false
      - name: Check workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - run: python3 -m unittest discover -s .github/scripts
      - run: dist plan --output-format=json > dist-plan.json
      - run: python3 .github/scripts/check_release.py dist-plan.json

  rust-lint:
    needs: changes
    if: needs.changes.outputs.rust_lint == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  rust-macos:
    needs: changes
    if: needs.changes.outputs.rust_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo nextest run --locked --all-features
      - run: cargo test --locked --all-features --doc
      - run: cargo build --locked --features cli --bin deepclone
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deepclone-aarch64-apple-darwin
          path: target/debug/deepclone
          retention-days: 90

  export:
    needs: changes
    if: needs.changes.outputs.export == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.9.16
      - run: uv run --directory export --locked ruff check .
      - run: uv run --directory export --locked ruff format --check .
      - run: uv run --directory export --locked python -m unittest discover -s tests

  release-preview:
    needs: changes
    if: needs.changes.outputs.release_preview == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-dist@0.34.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Verify release packaging without publishing
        run: python3 .github/scripts/package_release.py --output "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: deepclone-release-preview
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 90

  burn-linux:
    needs: changes
    if: needs.changes.outputs.burn_linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo clippy --locked --no-default-features --features burn,cli --all-targets -- -D warnings
      - run: cargo nextest run --locked --no-default-features --features burn,cli
      - run: cargo test --locked --no-default-features --features burn,cli --doc
      - run: cargo build --locked --no-default-features --features burn,cli --bin deepclone
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deepclone-linux
          path: target/debug/deepclone
          retention-days: 90

  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: wasm-bindgen-cli@0.2.130
      - run: cargo build --locked --profile browser --lib --no-default-features --features browser --target wasm32-unknown-unknown
      - run: wasm-bindgen --remove-name-section --remove-producers-section target/wasm32-unknown-unknown/browser/deepclone.wasm --target web --out-dir web/public/wasm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --cwd web --frozen-lockfile
      - run: bun test ./.github/scripts/audit_web.test.ts
      - run: bun run .github/scripts/audit_web.ts
      - run: bun run --cwd web test
      - run: bun run --cwd web build
      - run: bun run --cwd web playwright install --with-deps chromium
      - run: bun run --cwd web test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deepclone-browser
          path: web/dist/
          retention-days: 90

  ci-result:
    name: CI result
    needs: [changes, dependencies, workflows, rust-lint, rust-macos, export, release-preview, burn-linux, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all triggered CI jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = []
          for name, info in sorted(needs.items()):
              result = info.get("result")
              allowed = {"success"} if name == "changes" else {"success", "skipped"}
              if result not in allowed:
                  bad.append(f"{name}={result}")
          if bad:
              print("Failed CI jobs:", ", ".join(bad), file=sys.stderr)
              sys.exit(1)
          PY
