name: ci
on:
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "src/**", "tests/**", "export/**", "dist-workspace.toml", "release-plz.toml", ".github/**", "web/**"]
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", "src/**", "tests/**", "export/**", "dist-workspace.toml", "release-plz.toml", ".github/**", "web/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-audit
      - run: python3 -m unittest discover -s .github/scripts
      - run: python3 .github/scripts/check_dependencies.py
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked --all-features
      - run: cargo test --locked --all-features --doc
      - run: cargo build --locked --features cli --bin deepclone
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deepclone-aarch64-apple-darwin
          path: target/debug/deepclone
          retention-days: 90
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.9.16
      - run: uv run --directory export --locked ruff check .
      - run: uv run --directory export --locked ruff format --check .
      - run: uv run --directory export --locked python -m unittest discover -s tests
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-dist@0.34.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: stable
          cache: false
      - name: Check workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - run: python3 -m unittest discover -s .github/scripts
      - run: dist plan --output-format=json > dist-plan.json
      - run: python3 .github/scripts/check_release.py dist-plan.json
      - name: Verify release packaging without publishing
        run: python3 .github/scripts/package_release.py --output "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: deepclone-release-preview
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 90

  burn-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo clippy --locked --no-default-features --features burn,cli --all-targets -- -D warnings
      - run: cargo nextest run --locked --no-default-features --features burn,cli
      - run: cargo test --locked --no-default-features --features burn,cli --doc
      - run: cargo build --locked --no-default-features --features burn,cli --bin deepclone
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deepclone-linux
          path: target/debug/deepclone
          retention-days: 90
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: wasm-bindgen-cli@0.2.130
      - run: cargo build --locked --release --lib --no-default-features --features browser --target wasm32-unknown-unknown
      - run: wasm-bindgen target/wasm32-unknown-unknown/release/deepclone.wasm --target web --out-dir web/public/wasm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --cwd web --frozen-lockfile
      - run: bun audit --cwd web
      - run: bun run --cwd web test
      - run: bun run --cwd web build
      - run: bun run --cwd web playwright install --with-deps chromium
      - run: bun run --cwd web test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deepclone-browser
          path: web/dist/
          retention-days: 90
