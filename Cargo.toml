[package]
name = "deepclone"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lexoliu/deepclone"
description = "Qwen3-TTS voice cloning on Apple hardware through Core ML"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
browser = ["dep:getrandom","tokenizers/unstable_wasm", "burn", "streaming", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:gloo-timers", "dep:web-time", "rand/std_rng"]
burn = ["dep:burn", "dep:safetensors", "inference"]
sampling = ["dep:rand", "dep:thiserror"]
coreml = ["dep:ondevice-coreml", "dep:thiserror"]
generation = ["sampling"]
inference = ["generation", "dep:serde", "dep:serde_json", "dep:tokenizers", "dep:realfft"]
streaming = ["inference", "dep:tracing", "dep:async-channel", "dep:futures-lite", "dep:tokio"]
download = ["dep:ondevice"]
http = ["download", "ondevice/zenwave"]
cli = ["coreml", "streaming", "dep:async-io", "dep:rustix", "tokio/fs", "tokio/io-util", "http", "dep:futures-lite", "dep:clap", "dep:hound", "dep:tracing", "dep:tracing-subscriber", "rand/std_rng"]

[[bin]]
name = "deepclone"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
burn = { version = "0.22.1", default-features = false, features = ["std", "wgpu", "webgpu", "fusion", "autotune"], optional = true }
safetensors = { git = "https://github.com/lexoliu/safetensors", branch = "fix/wasm32-tensor-sizes", default-features = false, features = ["alloc"], optional = true }
rustix = { version = "1.1.6", default-features = false, features = ["std"], optional = true }
async-io = { version = "2.6.0", default-features = false, optional = true }
async-channel = { version = "2.5.0", default-features = false, features = ["std"], optional = true }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time"], optional = true }
ondevice = { git = "https://github.com/May-Agent/ondevice", branch = "dev", default-features = false, features = ["archive"], optional = true }
futures-lite = { version = "2.6.1", default-features = false, features = ["std", "race"], optional = true }
rand = { version = "0.10.3", default-features = false, features = ["std"], optional = true }
thiserror = { version = "2.0.21", default-features = false, optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "1.0.154", default-features = false, features = ["std"], optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
realfft = { version = "3.5.1", default-features = false, optional = true }
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"], optional = true }
hound = { version = "3.5.1", default-features = false, optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"], optional = true }

[dev-dependencies]
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
ondevice-coreml = { git = "https://github.com/May-Agent/ondevice", branch = "dev", default-features = false, optional = true }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.130", default-features = false, features = ["std"], optional = true }
wasm-bindgen-futures = { version = "0.4.80", default-features = false, features = ["std"], optional = true }
js-sys = { version = "0.3.107", default-features = false, features = ["std"], optional = true }
gloo-timers = { version = "0.4.0", default-features = false, features = ["futures"], optional = true }
web-time = { version = "1.1.0", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.4.3"
default-features = false
features = ["wasm_js"]
optional = true
